[mypy]
# Specify your target Python version
python_version = 3.10

# Behave like -Werror: treat missing type declarations as failures
; disallow_untyped_defs = True
; disallow_incomplete_defs = True
check_untyped_defs = True

# Prevent dynamic typing loopholes (forces everything to be explicitly typed)
disallow_any_generics = True
warn_return_any = True

# Strict None/Optional checks (avoids dreaded NonePointer exceptions)
strict_optional = True
no_implicit_optional = True

# Code quality warnings (cleans up redundant code)
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
warn_unreachable = True

# Ignore missing types from external 3rd-party libraries if they don't have stubs
ignore_missing_imports = True
